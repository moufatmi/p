<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصعب فاطمي - Moussab Fatmi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .title {
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
        }

        .bio {
            color: var(--text-sub);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }

        .qr-section {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #qrcode {
            background: white;
            padding: 8px;
            border-radius: 8px;
        }

        .qr-label {
            font-size: 11px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="avatar">M</div>
    <h1>مصعب فاطمي</h1>
    <span class="title">Front-End Developer & Civic Tech Enthusiast</span>
    
    <p class="bio">
        مطور واجهات ومبتكر أدوات رقمية مجتمعية تعزز الشفافية والوصول إلى المعرفة القانونية والبيانات المفتوحة.
    </p>

    <div class="links">
        <a href="https://moussab.com" class="btn" target="_blank">🌐 الموقع الشخصي (moussab.com)</a>
        <a href="mailto:contact@moussab.com" class="btn">✉️ التواصل عبر البريد</a>
    </div>

    <div class="qr-section">
        <div id="qrcode"></div>
        <span class="qr-label">امسح الكود لزيارة موقعي الشخصي</span>
    </div>
</div>

<script>
    // توليد رمز QR ديناميكياً لرابط موقعك
    new QRCode(document.getElementById("qrcode"), {
        text: "https://moussab.com",
        width: 110,
        height: 110,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>

</body>
</html>
